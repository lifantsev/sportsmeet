name: Gemini PR Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancels an older review run on the same PR if a new commit is pushed
concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gemini PR Review
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            Review the pull request diff for bugs, edge cases, security issues, and code quality.
            Provide concise, actionable feedback directly on the relevant changes.
