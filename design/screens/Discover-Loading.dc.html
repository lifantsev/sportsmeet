<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discover, loading</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F8F8F7}
a{color:#121316}a:hover{color:#2F62B0}
input::placeholder{color:#7C7F87}
@keyframes pkPulse{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes pkSpin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div style="min-height: 100vh; background: #F8F8F7; color: #121316; font-family: 'Schibsted Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased">
  <header style="background: #FFFFFF; border-bottom: 1px solid #ECECEE">
    <nav aria-label="Primary" style="max-width: 1280px; margin: 0 auto; padding: 14px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 32px; box-sizing: border-box">
      <a href="Discover-E.dc.html" style="font-size: 26px; font-weight: 800; letter-spacing: -0.05em; text-decoration: none; color: #121316">pickup</a>
      <div style="display: flex; flex-wrap: wrap; gap: 4px">
        <a href="Discover-E.dc.html" aria-current="page" style="padding: 10px 14px; color: #121316; font-size: 15px; font-weight: 700; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 8px">Discover</a>
        <a href="Map.dc.html" style="padding: 10px 14px; color: #63666E; font-size: 15px; font-weight: 500; text-decoration: none">Map</a>
        <a href="Create.dc.html" style="padding: 10px 14px; color: #63666E; font-size: 15px; font-weight: 500; text-decoration: none">Create</a>
        <a href="Profile.dc.html" style="padding: 10px 14px; color: #63666E; font-size: 15px; font-weight: 500; text-decoration: none">Profile</a>
      </div>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 12px">
        <a href="Create.dc.html" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: 999px; background: #121316; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Host a game</a>
        <a href="Profile.dc.html" aria-label="Your profile" style="width: 44px; height: 44px; border-radius: 999px; background: #E3E9F5; color: #2F62B0; display: grid; place-items: center; font-size: 15px; font-weight: 700; text-decoration: none">SL</a>
      </div>
    </nav>
  </header>

  <main aria-busy="true" style="max-width: 1280px; margin: 0 auto; padding: 52px 32px 96px; display: flex; flex-direction: column; gap: 32px; box-sizing: border-box">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <p style="margin: 0; font-size: 15px; font-weight: 600; color: #63666E">Friday, Oct 30 · Westwood, Los Angeles</p>
      <h1 style="margin: 0; font-size: 64px; line-height: 0.98; font-weight: 800; letter-spacing: -0.05em">Games near you</h1>
    </div>
    <label style="display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 22px; border: 1px solid #E2E2E6; border-radius: 999px; background: #FFFFFF; color: #63666E; box-sizing: border-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</span>
      <input type="search" placeholder="Search games, sports, or parks" style="flex: 1; min-width: 0; border: 0; background: transparent; outline: none; color: #121316; font: 400 17px 'Schibsted Grotesk', system-ui, sans-serif">
    </label>

    <p role="status" style="margin: 0; display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 600">
      <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 999px; border: 3px solid #DCDCE0; border-top-color: #121316; box-sizing: border-box; animation: pkSpin 0.9s linear infinite"></span>
      Finding games near you&#8230;
    </p>

    <div aria-hidden="true" style="display: flex; flex-wrap: wrap; border-radius: 28px; overflow: hidden; background: #FFFFFF; border: 1px solid #ECECEE; animation: pkPulse 1.4s ease-in-out infinite">
      <div style="flex: 1 1 460px; height: 300px; background: #ECECEF"></div>
      <div style="flex: 999 1 420px; padding: 32px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box">
        <div style="display: flex; gap: 8px"><span style="width: 96px; height: 28px; border-radius: 999px; background: #ECECEF"></span><span style="width: 110px; height: 28px; border-radius: 999px; background: #F1F1F3"></span></div>
        <span style="width: 80%; height: 36px; border-radius: 10px; background: #ECECEF"></span>
        <span style="width: 55%; height: 36px; border-radius: 10px; background: #ECECEF"></span>
        <span style="width: 45%; height: 18px; border-radius: 8px; background: #F1F1F3"></span>
        <span style="width: 35%; height: 18px; border-radius: 8px; background: #F1F1F3"></span>
        <span style="margin-top: auto; align-self: flex-end; width: 190px; height: 50px; border-radius: 999px; background: #ECECEF"></span>
      </div>
    </div>

    <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 22px; animation: pkPulse 1.4s ease-in-out 0.2s infinite">
      <div style="display: flex; flex-direction: column; border-radius: 26px; overflow: hidden; background: #FFFFFF; border: 1px solid #ECECEE">
        <div style="height: 180px; background: #ECECEF"></div>
        <div style="padding: 20px; display: flex; flex-direction: column; gap: 12px"><span style="width: 75%; height: 22px; border-radius: 8px; background: #ECECEF"></span><span style="width: 55%; height: 16px; border-radius: 8px; background: #F1F1F3"></span><span style="width: 45%; height: 16px; border-radius: 8px; background: #F1F1F3"></span><div style="display: flex; justify-content: space-between; padding-top: 10px"><span style="width: 120px; height: 30px; border-radius: 999px; background: #F1F1F3"></span><span style="width: 90px; height: 16px; margin-top: 7px; border-radius: 8px; background: #F1F1F3"></span></div></div>
      </div>
      <div style="display: flex; flex-direction: column; border-radius: 26px; overflow: hidden; background: #FFFFFF; border: 1px solid #ECECEE">
        <div style="height: 180px; background: #ECECEF"></div>
        <div style="padding: 20px; display: flex; flex-direction: column; gap: 12px"><span style="width: 65%; height: 22px; border-radius: 8px; background: #ECECEF"></span><span style="width: 60%; height: 16px; border-radius: 8px; background: #F1F1F3"></span><span style="width: 40%; height: 16px; border-radius: 8px; background: #F1F1F3"></span><div style="display: flex; justify-content: space-between; padding-top: 10px"><span style="width: 120px; height: 30px; border-radius: 999px; background: #F1F1F3"></span><span style="width: 90px; height: 16px; margin-top: 7px; border-radius: 8px; background: #F1F1F3"></span></div></div>
      </div>
      <div style="display: flex; flex-direction: column; border-radius: 26px; overflow: hidden; background: #FFFFFF; border: 1px solid #ECECEE">
        <div style="height: 180px; background: #ECECEF"></div>
        <div style="padding: 20px; display: flex; flex-direction: column; gap: 12px"><span style="width: 80%; height: 22px; border-radius: 8px; background: #ECECEF"></span><span style="width: 50%; height: 16px; border-radius: 8px; background: #F1F1F3"></span><span style="width: 45%; height: 16px; border-radius: 8px; background: #F1F1F3"></span><div style="display: flex; justify-content: space-between; padding-top: 10px"><span style="width: 120px; height: 30px; border-radius: 999px; background: #F1F1F3"></span><span style="width: 90px; height: 16px; margin-top: 7px; border-radius: 8px; background: #F1F1F3"></span></div></div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
