<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F8F8F7}
a{color:#121316}a:hover{color:#2F62B0}
input::placeholder{color:#7C7F87}
</style>
</helmet>
<div style="height: 100vh; min-height: 720px; display: flex; flex-direction: column; background: #F8F8F7; color: #121316; font-family: 'Schibsted Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased">
  <header style="flex: none; background: #FFFFFF; border-bottom: 1px solid #ECECEE">
    <nav aria-label="Primary" style="padding: 14px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 32px">
      <a href="Discover-E.dc.html" style="font-size: 26px; font-weight: 800; letter-spacing: -0.05em; text-decoration: none; color: #121316">pickup</a>
      <div style="display: flex; flex-wrap: wrap; gap: 4px">
        <a href="Discover-E.dc.html" style="padding: 10px 14px; color: #63666E; font-size: 15px; font-weight: 500; text-decoration: none">Discover</a>
        <a href="Map.dc.html" aria-current="page" style="padding: 10px 14px; color: #121316; font-size: 15px; font-weight: 700; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 8px">Map</a>
        <a href="Create.dc.html" style="padding: 10px 14px; color: #63666E; font-size: 15px; font-weight: 500; text-decoration: none">Create</a>
        <a href="Profile.dc.html" style="padding: 10px 14px; color: #63666E; font-size: 15px; font-weight: 500; text-decoration: none">Profile</a>
      </div>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 12px">
        <a href="Create.dc.html" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: 999px; background: #121316; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Host a game</a>
        <a href="Profile.dc.html" aria-label="Your profile" style="width: 44px; height: 44px; border-radius: 999px; background: #E3E9F5; color: #2F62B0; display: grid; place-items: center; font-size: 15px; font-weight: 700; text-decoration: none">SL</a>
      </div>
    </nav>
  </header>

  <div style="flex: 1; min-height: 0; display: flex; flex-wrap: wrap">
    <aside aria-label="Games in this area" style="flex: 1 1 380px; max-width: 460px; min-height: 0; height: 100%; display: flex; flex-direction: column; background: #FFFFFF; border-right: 1px solid #ECECEE">
      <div style="flex: none; padding: 20px 20px 14px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid #F0F0F2">
        <label style="display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 16px; border-radius: 999px; background: #F1F1F3; color: #63666E">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</span>
          <input type="search" placeholder="Search games, sports, or parks" style="flex: 1; min-width: 0; border: 0; background: transparent; outline: none; color: #121316; font: 400 15px 'Schibsted Grotesk', system-ui, sans-serif">
        </label>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <button style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #121316; background: #121316; color: #FFFFFF; font: 600 13px 'Schibsted Grotesk', system-ui, sans-serif; cursor: pointer">All sports</button>
          <button style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #E2E2E6; background: #FFFFFF; color: #121316; font: 500 13px 'Schibsted Grotesk', system-ui, sans-serif; cursor: pointer">Skill: Any</button>
          <button style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #E2E2E6; background: #FFFFFF; color: #121316; font: 500 13px 'Schibsted Grotesk', system-ui, sans-serif; cursor: pointer">This week</button>
          <button style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #E2E2E6; background: #FFFFFF; color: #121316; font: 500 13px 'Schibsted Grotesk', system-ui, sans-serif; cursor: pointer">Within 5 mi</button>
        </div>
        <span style="font-size: 14px; color: #63666E"><strong style="color: #121316">7 games</strong> in this area · soonest first</span>
      </div>
      <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{games}}" as="g" hint-placeholder-count="5">
          <button type="button" onClick="{{g.pick}}" aria-pressed="{{g.selected}}" style="display: flex; gap: 14px; padding: 10px; border-radius: 20px; border: 2px solid {{g.rowBorder}}; background: {{g.rowBg}}; color: #121316; text-align: left; font-family: inherit; cursor: pointer">
            <span style="flex: none; width: 84px; height: 84px; border-radius: 14px; overflow: hidden; display: block">
              <dc-import name="Court" sport="{{g.sport}}" h="84px" hint-size="84px,84px"></dc-import>
            </span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding-top: 2px">
              <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #63666E">{{g.sport}} · {{g.skill}}</span>
              <span style="font-size: 17px; line-height: 1.2; font-weight: 800; letter-spacing: -0.03em">{{g.title}}</span>
              <span style="font-size: 14px; color: #5C5F67">{{g.park}} · {{g.dist}}</span>
              <span style="display: flex; justify-content: space-between; gap: 8px; font-size: 14px"><span style="color: #5C5F67">{{g.when}}</span><span style="font-weight: 700; color: {{g.leftColor}}">{{g.leftText}}</span></span>
            </span>
          </button>
        </sc-for>
      </div>
    </aside>

    <section aria-label="Map" style="position: relative; flex: 999 1 560px; min-height: 520px; height: 100%; overflow: hidden; background: #EEF0EA">
      <svg width="100%" height="100%" viewBox="0 0 1000 800" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; inset: 0; display: block">
        <path d="M0 0H700V70C520 120 330 90 120 150 60 165 20 150 0 160Z" fill="#DEE8D6"></path>
        <path d="M520 200C600 170 700 190 720 250 735 320 690 380 610 385 540 390 500 330 505 270 507 235 512 210 520 200Z" fill="#D5E6CA"></path>
        <path d="M600 440H690V530H600Z" fill="#D5E6CA"></path>
        <path d="M300 280C340 260 400 270 410 300 420 335 380 355 330 350 290 345 280 300 300 280Z" fill="#DCE8D2"></path>
        <path d="M0 0H70C90 200 120 380 170 560 200 660 240 740 260 800H0Z" fill="#CFE1EE"></path>
        <path d="M70 0C90 200 120 380 170 560 200 660 240 740 260 800" fill="none" stroke="#EFE3C4" stroke-width="16" vector-effect="non-scaling-stroke"></path>
        <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" vector-effect="non-scaling-stroke">
          <path d="M100 185C300 205 450 165 560 172S800 212 1000 192"></path>
          <path d="M150 470C400 442 700 432 1000 422"></path>
          <path d="M190 560C450 540 700 522 1000 512"></path>
          <path d="M235 655C500 642 750 622 1000 612"></path>
          <path d="M660 172V800"></path>
          <path d="M800 0V800"></path>
          <path d="M330 150V800"></path>
        </g>
        <path d="M520 0C515 200 528 400 545 800" fill="none" stroke="#F1D79E" stroke-width="11" stroke-linecap="round" vector-effect="non-scaling-stroke"></path>
      </svg>
      <span style="position: absolute; left: 3%; top: 38%; font-size: 13px; font-style: italic; color: #5E7A90">Pacific Ocean</span>
      <span style="position: absolute; left: 33%; top: 30%; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #7C7F87">Brentwood</span>
      <span style="position: absolute; left: 24%; top: 66%; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #7C7F87">Santa Monica</span>
      <span style="position: absolute; left: 69%; top: 47%; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #7C7F87">Westwood</span>
      <span style="position: absolute; left: 84%; top: 56%; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #7C7F87">Century City</span>
      <span style="position: absolute; left: 66%; top: 20%; font-size: 13px; font-weight: 700; color: #4F7A44">UCLA</span>
      <span style="position: absolute; left: 51.5%; top: 74%; padding: 2px 6px; border-radius: 6px; background: #FFFFFF; border: 1px solid #E2E2E6; font-size: 11px; font-weight: 700">405</span>

      <sc-for list="{{games}}" as="g" hint-placeholder-count="7">
        <div style="position: absolute; left: {{g.x}}; top: {{g.y}}; transform: translate(-50%, -100%); z-index: {{g.z}}; display: flex; flex-direction: column; align-items: center">
          <sc-if value="{{g.selected}}" hint-placeholder-val="{{ false }}">
            <a href="Game.dc.html" style="margin-bottom: 10px; width: 240px; display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 12px 30px rgba(18,19,22,0.18); color: #121316; text-decoration: none">
              <span style="font-size: 16px; font-weight: 800; letter-spacing: -0.03em">{{g.title}}</span>
              <span style="font-size: 13px; color: #5C5F67">{{g.when}} · {{g.joined}}/{{g.max}} players</span>
              <span style="font-size: 13px; font-weight: 700; color: #2F62B0">View game</span>
            </a>
          </sc-if>
          <button type="button" onClick="{{g.pick}}" aria-label="{{g.title}}" style="width: {{g.pinSize}}; height: {{g.pinSize}}; border-radius: 999px; border: 3px solid #FFFFFF; background: {{g.pinBg}}; color: {{g.pinFg}}; display: grid; place-items: center; box-shadow: 0 6px 16px rgba(18,19,22,0.22); cursor: pointer; padding: 0">
            <sc-if value="{{g.isSoccer}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="24" r="20"></circle><path d="M24 17l6.7 4.8-2.6 7.9h-8.2l-2.6-7.9z" fill="currentColor"></path><path d="M24 17V4M30.7 21.8l12.3-4M28.1 29.7l7.7 10.5M19.9 29.7l-7.7 10.5M17.3 21.8 5 17.8"></path></svg></sc-if>
            <sc-if value="{{g.isBasketball}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.6" aria-hidden="true"><circle cx="24" cy="24" r="20"></circle><path d="M24 4v40M4 24h40M10.5 9.5c4.5 4 7 9 7 14.5s-2.5 10.5-7 14.5M37.5 9.5c-4.5 4-7 9-7 14.5s2.5 10.5 7 14.5"></path></svg></sc-if>
            <sc-if value="{{g.isVolleyball}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.6" aria-hidden="true"><circle cx="24" cy="24" r="20"></circle><path d="M24 24c0-8 4-15 12-18M24 24c-7 4-15 4-21-1M24 24c7 4 11 11 11 18"></path></svg></sc-if>
            <sc-if value="{{g.isTennis}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.6" aria-hidden="true"><circle cx="24" cy="24" r="20"></circle><path d="M7.5 12.5c6 6 6 17 0 23M40.5 12.5c-6 6-6 17 0 23"></path></svg></sc-if>
            <sc-if value="{{g.isUltimate}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.6" aria-hidden="true"><ellipse cx="24" cy="26" rx="20" ry="8"></ellipse><ellipse cx="24" cy="25.5" rx="9" ry="3"></ellipse></svg></sc-if>
            <sc-if value="{{g.isSpikeball}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" aria-hidden="true"><ellipse cx="24" cy="24" rx="20" ry="8"></ellipse><path d="M8 28l2 14M40 28l-2 14"></path></svg></sc-if>
          </button>
          <span aria-hidden="true" style="width: 3px; height: 10px; background: {{g.pinBg}}"></span>
        </div>
      </sc-for>

      <span style="position: absolute; left: 50%; top: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 18px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 6px 18px rgba(18,19,22,0.12); font-size: 14px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v4h-4"></path></svg>Search this area</span>
      <div style="position: absolute; right: 20px; top: 20px; display: flex; flex-direction: column; border-radius: 14px; background: #FFFFFF; box-shadow: 0 6px 18px rgba(18,19,22,0.12); overflow: hidden">
        <button aria-label="Zoom in" style="width: 44px; height: 44px; border: 0; border-bottom: 1px solid #ECECEE; background: #FFFFFF; font: 600 22px 'Schibsted Grotesk', sans-serif; cursor: pointer">+</button>
        <button aria-label="Zoom out" style="width: 44px; height: 44px; border: 0; background: #FFFFFF; font: 600 22px 'Schibsted Grotesk', sans-serif; cursor: pointer">&#8722;</button>
      </div>
      <button aria-label="Center on my location" style="position: absolute; right: 20px; bottom: 24px; width: 48px; height: 48px; border-radius: 999px; border: 0; background: #FFFFFF; box-shadow: 0 6px 18px rgba(18,19,22,0.12); display: grid; place-items: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="#121316" aria-hidden="true"><path d="M21 3 3 10.5l7.5 3 3 7.5z"></path></svg></button>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'g0' };
  }
  renderVals() {
    const base = [
      { id: 'g0', sport: 'Basketball', skill: 'Intermediate', title: 'Friday Night Runs', park: 'Pauley Pavilion courts', dist: '0.3 mi', when: 'Today, 6:30 PM', joined: 8, max: 10, x: '66%', y: '33%' },
      { id: 'g1', sport: 'Basketball', skill: 'Advanced', title: '3v3 half court, winners stay on', park: 'Pauley Pavilion courts', dist: '0.3 mi', when: 'Today, 8:00 PM', joined: 5, max: 6, x: '71%', y: '28%' },
      { id: 'g2', sport: 'Beach volleyball', skill: 'Intermediate', title: 'Doubles, king of the court', park: 'Santa Monica beach courts', dist: '4.8 mi', when: 'Sat, 10:30 AM', joined: 6, max: 8, x: '18%', y: '76%' },
      { id: 'g3', sport: 'Spikeball', skill: 'Beginner', title: 'Roundnet on the lawn', park: 'Sunset Rec', dist: '0.9 mi', when: 'Sat, 2:00 PM', joined: 4, max: 8, x: '56%', y: '25%' },
      { id: 'g4', sport: 'Soccer', skill: 'All levels', title: 'Sunday morning 7v7', park: 'Drake Stadium fields', dist: '0.6 mi', when: 'Sun, 9:00 AM', joined: 11, max: 14, x: '61%', y: '42%' },
      { id: 'g5', sport: 'Tennis', skill: 'Beginner', title: 'Doubles rally for new players', park: 'Westwood Park', dist: '1.4 mi', when: 'Sun, 4:00 PM', joined: 2, max: 4, x: '64.5%', y: '60%' },
      { id: 'g6', sport: 'Ultimate', skill: 'Intermediate', title: 'Ultimate scrimmage under the lights', park: 'Drake Stadium fields', dist: '0.6 mi', when: 'Mon, 7:00 PM', joined: 9, max: 14, x: '56.5%', y: '46%' }
    ];
    const sel = this.state.sel;
    const games = base.map((g) => {
      const on = g.id === sel;
      const left = g.max - g.joined;
      return Object.assign({}, g, {
        selected: on,
        isSoccer: g.sport === 'Soccer', isBasketball: g.sport === 'Basketball', isVolleyball: g.sport === 'Beach volleyball',
        isTennis: g.sport === 'Tennis', isUltimate: g.sport === 'Ultimate', isSpikeball: g.sport === 'Spikeball',
        rowBorder: on ? '#121316' : 'transparent', rowBg: on ? '#FFFFFF' : '#FFFFFF',
        pinBg: on ? '#121316' : '#FFFFFF', pinFg: on ? '#FFFFFF' : '#121316', pinSize: on ? '52px' : '42px', z: on ? 5 : 1,
        leftText: left === 1 ? '1 spot left' : left + ' spots left',
        leftColor: left <= 2 ? '#2F62B0' : '#5C5F67',
        pick: () => this.setState({ sel: g.id })
      });
    });
    return { games };
  }
}
</script>
</body>
</html>
