<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Host a game (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F8F8F7}
a{color:#121316}a:hover{color:#2F62B0}
input::placeholder,textarea::placeholder{color:#7C7F87}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F8F8F7; color: #121316; font-family: 'Schibsted Grotesk', ui-sans-serif, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased">
  <div style="position: absolute; inset: 0; overflow-y: auto; padding: 54px 20px 130px; display: flex; flex-direction: column; gap: 22px; box-sizing: border-box">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Mobile-Discover.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1px solid #ECECEE; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
      <button type="button" style="height: 40px; padding: 0 14px; border: 0; background: transparent; color: #4D5058; font: 600 15px 'Schibsted Grotesk', system-ui, sans-serif">Save draft</button>
    </div>
    <h1 style="margin: 0; font-size: 34px; line-height: 1; font-weight: 800; letter-spacing: -0.05em">Host a game</h1>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 15px; font-weight: 700">Sport</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{sports}}" as="s" hint-placeholder-count="6">
          <button type="button" aria-pressed="{{s.on}}" onClick="{{s.pick}}" style="height: 48px; padding: 0 6px; border-radius: 14px; border: 1px solid {{s.border}}; background: {{s.bg}}; color: {{s.fg}}; font: 600 14px 'Schibsted Grotesk', system-ui, sans-serif; cursor: pointer">{{s.short}}</button>
        </sc-for>
      </div>
    </div>

    <label style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 15px; font-weight: 700">Title</span><input type="text" value="Doubles rally for new players" style="height: 52px; padding: 0 14px; border-radius: 14px; border: 1px solid #DFDFE3; background: #FFFFFF; font: 500 16px 'Schibsted Grotesk', system-ui, sans-serif; box-sizing: border-box"></label>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 15px; font-weight: 700">Location</span>
      <div style="display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; border: 1px solid #DFDFE3; background: #FFFFFF">
        <label style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-bottom: 1px solid #ECECEE">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#63666E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search parks and courts</span>
          <input type="search" value="Westwood Park" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: 500 16px 'Schibsted Grotesk', system-ui, sans-serif">
        </label>
        <div style="position: relative; height: 140px; background: #EEF0EA">
          <svg width="100%" height="140" viewBox="0 0 350 140" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block"><path d="M140 70H230V130H140Z" fill="#D5E6CA"></path><g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"><path d="M0 50C120 45 240 42 350 40"></path><path d="M250 0V140"></path></g><path d="M110 0C108 50 112 100 116 140" fill="none" stroke="#F1D79E" stroke-width="8"></path></svg>
          <span style="position: absolute; left: 52%; top: 72%; transform: translate(-50%, -100%); width: 36px; height: 36px; border-radius: 999px; border: 3px solid #FFFFFF; background: #121316; display: grid; place-items: center; box-shadow: 0 6px 14px rgba(18,19,22,0.25)"><span style="width: 8px; height: 8px; border-radius: 999px; background: #FFFFFF"></span></span>
        </div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 15px; font-weight: 700">Date</span><input type="text" value="Sun, Nov 1" style="height: 50px; padding: 0 14px; border-radius: 14px; border: 1px solid #DFDFE3; background: #FFFFFF; font: 500 16px 'Schibsted Grotesk', system-ui, sans-serif; box-sizing: border-box; min-width: 0"></label>
      <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 15px; font-weight: 700">Time</span><input type="text" value="4:00 PM" style="height: 50px; padding: 0 14px; border-radius: 14px; border: 1px solid #DFDFE3; background: #FFFFFF; font: 500 16px 'Schibsted Grotesk', system-ui, sans-serif; box-sizing: border-box; min-width: 0"></label>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 15px; font-weight: 700">Skill level</span>
      <div role="radiogroup" aria-label="Skill level" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
        <button type="button" role="radio" aria-checked="false" style="height: 44px; border-radius: 12px; border: 1px solid #E2E2E6; background: #FFFFFF; font: 600 14px 'Schibsted Grotesk', system-ui, sans-serif">All levels</button>
        <button type="button" role="radio" aria-checked="true" style="height: 44px; border-radius: 12px; border: 1px solid #121316; background: #121316; color: #FFFFFF; font: 600 14px 'Schibsted Grotesk', system-ui, sans-serif">Beginner</button>
        <button type="button" role="radio" aria-checked="false" style="height: 44px; border-radius: 12px; border: 1px solid #E2E2E6; background: #FFFFFF; font: 600 14px 'Schibsted Grotesk', system-ui, sans-serif">Intermediate</button>
        <button type="button" role="radio" aria-checked="false" style="height: 44px; border-radius: 12px; border: 1px solid #E2E2E6; background: #FFFFFF; font: 600 14px 'Schibsted Grotesk', system-ui, sans-serif">Advanced</button>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 12px 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #DFDFE3">
      <span style="font-size: 15px; font-weight: 700">Max players</span>
      <div style="display: flex; align-items: center; gap: 4px; padding: 3px; border-radius: 999px; background: #F1F1F3">
        <button type="button" aria-label="Fewer players" onClick="{{dec}}" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: #FFFFFF; font: 600 20px 'Schibsted Grotesk', sans-serif; cursor: pointer">&#8722;</button>
        <span style="min-width: 36px; text-align: center; font-size: 18px; font-weight: 800">{{max}}</span>
        <button type="button" aria-label="More players" onClick="{{inc}}" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: #FFFFFF; font: 600 20px 'Schibsted Grotesk', sans-serif; cursor: pointer">+</button>
      </div>
    </div>

    <label style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 15px; font-weight: 700">Notes for players</span><textarea rows="3" placeholder="What to bring, how teams are split, where to meet" style="padding: 12px 14px; border-radius: 14px; border: 1px solid #DFDFE3; background: #FFFFFF; font: 400 16px/1.45 'Schibsted Grotesk', system-ui, sans-serif; resize: none; box-sizing: border-box"></textarea></label>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 30px; background: rgba(248,248,247,0.96); backdrop-filter: blur(16px); border-top: 1px solid #ECECEE">
    <a href="Mobile-Game.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #121316; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none">Post game</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sport: 'Tennis', max: 4 };
  }
  renderVals() {
    const st = this.state;
    const all = [['Basketball', 'Basketball'], ['Soccer', 'Soccer'], ['Beach volleyball', 'Volleyball'], ['Tennis', 'Tennis'], ['Ultimate', 'Ultimate'], ['Spikeball', 'Spikeball']];
    const sports = all.map((a) => {
      const on = st.sport === a[0];
      return { short: a[1], on, bg: on ? '#121316' : '#FFFFFF', fg: on ? '#FFFFFF' : '#121316', border: on ? '#121316' : '#E2E2E6', pick: () => this.setState({ sport: a[0] }) };
    });
    return {
      sports, max: st.max,
      dec: () => this.setState({ max: Math.max(2, st.max - 1) }),
      inc: () => this.setState({ max: Math.min(30, st.max + 1) })
    };
  }
}
</script>
</body>
</html>
