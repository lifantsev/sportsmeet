<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Sign In</title>
    <script src="./vendor/react.js"></script>
    <script src="./vendor/react-dom.js"></script>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500..900;1,800..900&amp;display=swap"
          rel="stylesheet"
        >
        <style>
          body {
            margin: 0;
            background: #F1EFEE;
          }

          .r {
            width: 968px;
            box-sizing: border-box;
            padding: 16px 40px 40px;
            background: #F1EFEE;
            font: 500 13px Archivo, Arial, sans-serif;
            color: #080909;
          }

          .r * {
            box-sizing: border-box;
            border-radius: 0;
          }

          .n {
            display: flex;
            gap: 18px;
            align-items: baseline;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
          }

          .n a {
            color: var(--pri);
            text-decoration: none;
          }

          .n a.on {
            border-bottom: 2px solid var(--acc);
          }

          .n b {
            font: 600 16px Archivo;
            text-transform: none;
            color: #080909;
            margin-right: auto;
          }

          .t {
            font: italic 900 34px/1 Archivo;
            text-transform: uppercase;
            letter-spacing: -.03em;
            margin: 12px 0 16px;
          }

          .h {
            font: 800 15px Archivo;
            text-transform: uppercase;
            letter-spacing: -.01em;
            margin: 22px 0 10px;
          }

          .sp {
            color: var(--acc);
            font: italic 800 17px Archivo;
            text-transform: uppercase;
            letter-spacing: -.01em;
          }

          .ti {
            font: 800 14px Archivo;
            text-transform: uppercase;
            margin: 4px 0 8px;
          }

          .tm {
            display: flex;
            gap: 5px;
            align-items: center;
            font: 800 11px Archivo;
            color: var(--pri);
            margin-bottom: 8px;
          }

          .m {
            display: flex;
            gap: 8px;
            align-items: center;
            font: 700 10px Archivo;
            color: var(--pri);
            margin-bottom: 10px;
          }

          .m i {
            font-style: normal;
            color: #777;
          }

          .ic {
            width: 10px;
            height: 10px;
            fill: var(--pri);
            flex: none;
          }

          .b {
            background: var(--acc);
            color: #fff;
            border: 0;
            font: 800 12px Archivo;
            text-transform: uppercase;
            padding: 10px 12px;
            cursor: pointer;
          }

          .b.g {
            background: #DFE0E4;
            color: #4a4d55;
          }

          .b.n2 {
            background: var(--pri);
          }

          .at {
            display: inline-flex;
            gap: 5px;
            align-items: center;
            font: 800 13px Archivo;
            color: var(--pri);
            margin-left: 10px;
          }

          .cd {
            position: relative;
            display: flex;
            height: 150px;
            background: #FDFDFC;
            border: 1px solid #E3E1DE;
            overflow: hidden;
            margin-bottom: 12px;
          }

          .cl {
            padding: 20px 17px;
            width: 420px;
            position: relative;
            z-index: 1;
          }

          .ar {
            position: absolute;
            right: 0;
            top: 0;
            width: 440px;
            height: 100%;
            clip-path: polygon(105px 0, 100% 0, 100% 100%, 0 100%);
          }

          .ds {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
          }

          .ds span {
            flex: 1;
            padding: 6px 4px;
            font: 800 9px Archivo;
            background: var(--sec);
            text-transform: uppercase;
          }

          .ds span.on {
            background: var(--pri);
            color: #fff;
          }

          .fl {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
          }

          .fl span {
            background: #fff;
            color: color-mix(in srgb, var(--acc), #000 35%);
            font: 700 12px Archivo;
            padding: 9px 12px;
          }

          .fl span.on {
            background: var(--pri);
            color: #fff;
          }

          .bx {
            background: #FDFDFC;
            border: 1px solid #E3E1DE;
            padding: 14px 17px;
            margin-bottom: 10px;
          }

          .in {
            display: block;
            width: 100%;
            background: #FDFDFC;
            border: 1px solid var(--pri);
            padding: 10px;
            font: 500 13px Archivo;
            color: #080909;
          }

          .lb {
            display: block;
            font: 700 12px Archivo;
            margin-bottom: 4px;
          }

          .er {
            color: color-mix(in srgb, var(--acc), #000 15%);
            font: 700 12px Archivo;
            margin-top: 4px;
          }

          .in.bad {
            border: 2px solid var(--acc);
          }

          .sg {
            display: flex;
            gap: 4px;
          }

          .sg span {
            flex: 1;
            background: #fff;
            border: 1px solid var(--pri);
            padding: 9px;
            font: 700 12px Archivo;
            color: var(--pri);
          }

          .sg span.on {
            background: var(--pri);
            color: #fff;
          }

          .tag {
            display: inline-block;
            background: var(--pri);
            color: #fff;
            font: 800 10px Archivo;
            text-transform: uppercase;
            padding: 3px 6px;
          }

          .tag.g {
            background: #DFE0E4;
            color: #4a4d55;
          }

          .rw {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #D9D6D2;
            font-size: 12px;
          }

          .rw b {
            width: 120px;
          }

          .msg {
            padding: 12px 14px;
            border-left: 4px solid var(--pri);
            background: #FDFDFC;
            margin-bottom: 8px;
            font-size: 13px;
          }

          .msg.e {
            border-color: var(--acc);
          }
        </style>
        <link
          href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&amp;display=swap"
          rel="stylesheet"
        >
      </helmet>
      <div
        class="r"
        style="min-height:640px;--pri:{{primary}};--acc:{{accent}};--sec:{{secondary}}"
      >
        <svg width="0" height="0" style="position:absolute" aria-hidden="true">
          <symbol id="c" viewBox="0 0 10 10">
            <path d="M5 0a5 5 0 1 0 0 10A5 5 0 0 0 5 0zm.6 2.5v2.4l1.8 1.1-.5.8L4.700 5.400V2.500z"></path>
          </symbol>
          <symbol id="p" viewBox="0 0 10 10">
            <path d="M5 0a3.200 3.200 0 0 0-3.200 3.200C1.800 5.500 5 10 5 10s3.200-4.500 3.200-6.800A3.200 3.200 0 0 0 5 0z"></path>
          </symbol>
          <symbol id="a" viewBox="0 0 10 10">
            <path d="M10 0L0 4l4 2 2 4z"></path>
          </symbol>
          <symbol id="s" viewBox="0 0 10 10">
            <path d="M1 10V6h2v4zM4 10V3h2v7zM7 10V0h2v10z"></path>
          </symbol>
          <symbol id="u" viewBox="0 0 10 10">
            <circle cx="5" cy="2.600" r="2.600"></circle>
            <path d="M0 10c0-3 2-4.500 5-4.500S10 7 10 10z"></path>
          </symbol>
        </svg>
        <div class="n">
          <b>pickup</b>
        </div>
        <div class="t">Sign In</div>
        <div style="display:flex;gap:40px;align-items:flex-start">
          <div style="width:380px">
            <div class="msg">Sign in to join, comment or create a game.</div>
            <button
              style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:40px;background:#fff;border:1px solid #747775;border-radius:0;font:500 14px Roboto,Arial,sans-serif;color:#1F1F1F;cursor:pointer;margin:0 0 16px"
            >
              <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
              </svg>
              Sign in with Google
            </button>
            <div style="font:700 12px Archivo;margin-bottom:16px;border-top:1px solid #D9D6D2;padding-top:10px">Or use your email</div>
            <label class="lb" for="e">Email</label>
            <input id="e" class="in" type="email" value="alex@ucla.edu" style="margin-bottom:12px">
            <label class="lb" for="w">Password</label>
            <input id="w" class="in bad" type="password" value="pickup" style="margin-bottom:0">
            <div class="er">Email or password is incorrect.</div>
            <div style="margin-top:16px;display:flex;gap:14px;align-items:center">
              <button class="b">Sign In</button>
              <span style="font-size:12px">
                New to pickup?
                <a href="#" style="color:var(--pri);font-weight:700">Create account</a>
              </span>
            </div>
          </div>
          <div style="position:relative;flex:1;height:360px;overflow:hidden">
            <svg
              class="ar"
              viewBox="0 0 440 150"
              preserveAspectRatio="xMidYMid slice"
              aria-hidden="true"
            >
              <rect width="440" height="150" fill="var(--sec)"></rect>
              <g fill="color-mix(in srgb,var(--sec),#000 12%)">
                <rect x="60" width="60" height="150"></rect>
                <rect x="180" width="60" height="150"></rect>
                <rect x="300" width="60" height="150"></rect>
              </g>
              <g fill="none" stroke="#F8EFD6" stroke-width="2">
                <rect x="30" y="10" width="400" height="130"></rect>
                <path d="M230 10v130"></path>
                <circle cx="230" cy="75" r="30"></circle>
                <rect x="30" y="42" width="60" height="66"></rect>
                <rect x="370" y="42" width="60" height="66"></rect>
              </g>
              <circle cx="230" cy="75" r="6" fill="color-mix(in srgb,var(--acc),#000 35%)"></circle>
            </svg>
          </div>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"primary":{"editor":"color","default":"#032C40","options":["#032C40","#1B3A2E","#2B2A4C","#3A1F2B"],"section":"Theme"},"accent":{"editor":"color","default":"#CE0C1B","options":["#CE0C1B","#E8590C","#0B7A4B","#6B3FD4"],"section":"Theme"},"secondary":{"editor":"color","default":"#6699B5","options":["#6699B5","#8FA89A","#B5A06A","#9A8CB8"],"section":"Theme"},"$preview":{"width":968,"height":640}}'
    >
      class Component extends DCLogic {
        renderVals() {
          return {
            primary: this.props.primary ?? '#032C40',
            accent: this.props.accent ?? '#CE0C1B',
            secondary: this.props.secondary ?? '#6699B5'
          };
        }
      }
    </script>
  </body>
</html>
